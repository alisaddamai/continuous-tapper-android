plugins { id 'com.android.application' }

android {
    namespace 'com.saddamali.continuoustapper'
    compileSdk 35
    defaultConfig {
        applicationId 'com.saddamali.continuoustapper'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        release {
            // Test distribution only. Uses the Android debug certificate.
            // This is not a Play Store signing configuration.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
